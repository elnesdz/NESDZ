name: Build ULM France

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data-source/basulm.kml'
      - 'scripts/build-ulm-fr.mjs'
      - '.github/workflows/build-ulm-fr.yml'

permissions:
  contents: write

jobs:
  build-ulm-fr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate ULM France JSON
        run: node scripts/build-ulm-fr.mjs

      - name: Commit generated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/ulm-fr.json

          if git diff --cached --quiet; then
            echo "Aucun changement à commit"
            exit 0
          fi

          git commit -m "build: generate ULM France JSON"
          git push
