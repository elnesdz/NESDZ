name: Build airports world lite

on:
  workflow_dispatch:
  push:
    paths:
      - data-source/airports.csv
      - scripts/build-airports-world-lite.mjs
      - .github/workflows/build-airports-world-lite.yml

permissions:
  contents: write

jobs:
  build-airports-world-lite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate airports world lite JSON
        run: node scripts/build-airports-world-lite.mjs

      - name: Show generated file size
        run: ls -lh public/data/airports-world-lite.json

      - name: Commit generated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/airports-world-lite.json
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git commit -m "chore(data): build airports world lite"
          git push

