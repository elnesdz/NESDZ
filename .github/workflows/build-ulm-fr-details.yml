name: Build ULM France details

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ulm-fr-details:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate ULM France detailed JSON from BASULM API
        env:
          BASULM_API_KEY: ${{ secrets.BASULM_API_KEY }}
          BASULM_USER_AGENT: "NESDZ-BASULM-Importer/1.0"
        run: python scripts/build-ulm-fr-details.py

      - name: Commit generated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/ulm-fr-details.json

          if git diff --cached --quiet; then
            echo "Aucun changement à commit"
            exit 0
          fi

          git commit -m "build: generate ULM France details JSON"
          git push
