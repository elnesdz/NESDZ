name: Build Frequencies France Merged

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/data/frequencies-fr.json'
      - 'public/data/frequencies-fr-sia.json'
      - 'scripts/build-frequencies-fr-merged.py'
      - '.github/workflows/build-frequencies-fr-merged.yml'

permissions:
  contents: write

jobs:
  build-frequencies-fr-merged:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate merged France frequencies JSON
        run: python scripts/build-frequencies-fr-merged.py

      - name: Commit generated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/frequencies-fr-merged.json

          if git diff --cached --quiet; then
            echo "Aucun changement à commit"
            exit 0
          fi

          git commit -m "build: generate merged France frequencies JSON"
          git push
