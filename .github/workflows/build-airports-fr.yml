name: Build airports FR JSON

on:
  workflow_dispatch:
  push:
    paths:
      - "data-source/airports.csv"
      - "data-source/runways.csv"
      - "scripts/build-airports-fr.mjs"

jobs:
  build-airports:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run airports build script
        run: node scripts/build-airports-fr.mjs

      - name: Commit generated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build airports-fr-full.json"
          file_pattern: public/data/airports-fr-full.json
